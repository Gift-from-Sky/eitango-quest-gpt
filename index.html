<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="中学生向け英単語100語を、音声・5秒バトル・3つの冒険コースで学べる8ビットRPGクイズ。">
  <title>英単語クエスト | 中学生向け英単語RPG</title>
  <style>:root {
  --ink: #17233d;
  --teal: #16a6a1;
  --teal-dark: #087f7b;
  --yellow: #ffd86b;
  --cream: #fffaf0;
  --white: #fff;
  --correct: #12805c;
  --wrong: #c94655;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-width: 320px;
  min-height: 100%;
  margin: 0;
  overflow-x: hidden;
}

body {
  color: var(--ink);
  background: var(--cream);
  font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}

button {
  min-height: 52px;
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 3px solid var(--ink);
  outline-offset: 3px;
  box-shadow: 0 0 0 3px var(--yellow);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.78;
}

.start-screen {
  position: relative;
  display: grid;
  min-height: 100vh;
  min-height: 100dvh;
  place-items: center;
  overflow-x: hidden;
  overflow-y: auto;
  padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  color: #fff5cf;
  background: radial-gradient(circle at 50% 12%, #423275 0, #1c1648 42%, #0d102b 100%);
  text-align: center;
}

.particle-field {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.particle {
  position: absolute;
  display: block;
}

.particle-star {
  width: 4px;
  height: 4px;
  background: #fff3b5;
  box-shadow: 0 0 12px #fff3b5;
}

.particle-ember {
  width: 5px;
  height: 5px;
  background: #ffb13b;
  box-shadow: 0 0 10px #ff7b36;
  animation: ember-flicker 2.8s ease-in-out infinite alternate;
}

.start-panel {
  position: relative;
  display: grid;
  width: min(100%, 430px);
  justify-items: center;
  padding: clamp(30px, 8vw, 48px) clamp(22px, 7vw, 40px);
  border: 4px solid #f3c75b;
  box-shadow: 0 0 0 4px #51376f, 0 0 0 8px #e5a93e, 0 20px 44px rgba(0, 0, 0, 0.38);
  background: rgba(18, 15, 50, 0.82);
}

.quest-crest {
  display: grid;
  width: 78px;
  height: 78px;
  place-items: center;
  clip-path: polygon(0 14%, 14% 14%, 14% 0, 86% 0, 86% 14%, 100% 14%, 100% 86%, 86% 86%, 86% 100%, 14% 100%, 14% 86%, 0 86%);
  box-shadow: inset 0 0 0 7px #ffec9d, inset 0 0 0 13px #9b522f;
  background: #d7893e;
  color: #fff8d9;
  font-family: Georgia, serif;
  font-size: 2.8rem;
  font-weight: 900;
  text-shadow: 3px 3px 0 #672e31;
}

.start-kicker,
.start-subtitle,
.sound-reminder {
  margin: 0;
}

.start-kicker {
  margin-top: 23px;
  color: #e4c5ff;
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.15em;
}

.start-panel h1 {
  margin: 10px 0 0;
  color: #fff0a3;
  font-size: clamp(2rem, 11vw, 3.2rem);
  line-height: 1.15;
  text-shadow: 3px 3px 0 #5f2941;
}

.start-subtitle {
  margin-top: 9px;
  color: #f7d678;
  font-size: 0.8rem;
  font-weight: 900;
  letter-spacing: 0.11em;
}

.start-button {
  width: 100%;
  min-height: 52px;
  margin-top: 30px;
  border: 3px solid #fff0a3;
  box-shadow: 0 5px 0 #84353d;
  color: #331933;
  background: #f3bd55;
  font-weight: 900;
  letter-spacing: 0.12em;
}

.start-button:hover {
  background: #ffe087;
  transform: translateY(-1px);
}

.sound-reminder {
  margin-top: 22px;
  color: #d6d3ee;
  font-size: 0.75rem;
  line-height: 1.6;
}

.lobby-screen {
  display: grid;
  min-height: 100vh;
  min-height: 100dvh;
  place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  color: #fff5cf;
  background:
    radial-gradient(circle at 82% 9%, rgba(127, 89, 198, 0.55), transparent 31rem),
    linear-gradient(145deg, #0e153c, #28174c 58%, #131331);
}

.lobby-panel {
  width: min(100%, 620px);
  padding: clamp(22px, 6vw, 42px);
  border: 4px solid #f3c75b;
  box-shadow: 0 0 0 4px #51376f, 0 0 0 8px #e5a93e, 0 20px 44px rgba(0, 0, 0, 0.38);
  background: rgba(18, 15, 50, 0.94);
}

.lobby-header {
  margin-bottom: 24px;
  text-align: center;
}

.lobby-header p,
.lobby-header h1 {
  margin: 0;
}

.lobby-header p {
  color: #e4c5ff;
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.15em;
}

.lobby-header h1 {
  margin-top: 8px;
  color: #fff0a3;
  font-size: clamp(1.8rem, 8vw, 2.7rem);
  text-shadow: 3px 3px 0 #5f2941;
}

.name-field {
  display: grid;
  gap: 8px;
  color: #fff0a3;
  font-weight: 900;
}

.name-field input {
  width: 100%;
  min-height: 52px;
  border: 3px solid #f3c75b;
  border-radius: 0;
  padding: 10px 13px;
  color: #241538;
  background: #fff9e8;
  font: inherit;
}

.name-field input:focus-visible {
  outline: 3px solid #fff0a3;
  outline-offset: 2px;
}

.privacy-note,
.name-error,
.course-confirmation {
  margin: 9px 0 0;
  font-size: 0.8rem;
  line-height: 1.55;
}

.privacy-note { color: #d6d3ee; }
.name-error { color: #ffc0be; font-weight: 800; }
.course-confirmation { color: #baf7cf; font-weight: 800; }

.course-select { margin-top: 24px; }

.course-select h2 {
  margin: 0 0 12px;
  color: #fff0a3;
  font-size: 1rem;
}

.course-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.course-card {
  display: grid;
  min-height: 96px;
  gap: 8px;
  align-content: center;
  border: 3px solid #e5a93e;
  box-shadow: 0 4px 0 #5f2941;
  padding: 10px;
  color: #fff8d9;
  background: #3a285e;
  font-weight: 900;
}

.course-card:hover,
.course-card[aria-pressed="true"] {
  border-color: #fff0a3;
  background: #624481;
  transform: translateY(-1px);
}

.course-card__name { font-size: clamp(0.8rem, 3.4vw, 1rem); }
.course-card__count { color: #f7d678; font-size: 0.78rem; }

.sound-settings {
  display: flex;
  flex-wrap: wrap;
  gap: 9px 16px;
  margin: 26px 0 0;
  border: 2px solid #896ba8;
  padding: 12px;
}

.sound-settings legend {
  padding: 0 6px;
  color: #e4c5ff;
  font-size: 0.8rem;
  font-weight: 900;
}

.sound-settings label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #fff8d9;
  font-size: 0.86rem;
  font-weight: 800;
}

.sound-settings input { width: 20px; height: 20px; accent-color: #f3bd55; }

@keyframes ember-flicker {
  from {
    opacity: 0.45;
    transform: translateY(4px) scale(0.7);
  }

  to {
    opacity: 1;
    transform: translateY(-4px) scale(1.2);
  }
}

@media (max-width: 470px) {
  .course-list { grid-template-columns: 1fr; }
  .course-card { min-height: 62px; grid-template-columns: 1fr auto; align-items: center; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Result and ranking screens */
.result-screen {
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(24px, env(safe-area-inset-top)) 16px max(34px, env(safe-area-inset-bottom));
  color: #fff5cf;
  background: radial-gradient(circle at 50% 0, #5d3d83 0, #17133c 48%, #090d28 100%);
}

.result-panel {
  width: min(100%, 680px);
  margin: 0 auto;
  border: 4px solid #f3c75b;
  box-shadow: 0 0 0 4px #51376f, 0 0 0 8px #e5a93e, 0 20px 44px rgba(0, 0, 0, 0.38);
  padding: clamp(22px, 6vw, 42px);
  background: rgba(18, 15, 50, 0.94);
  text-align: center;
}

.result-screen__eyebrow, .ranking-board > header > p {
  margin: 0;
  color: #e4c5ff;
  font-size: 0.7rem;
  font-weight: 900;
  letter-spacing: .14em;
}

.result-panel h1, .ranking-board h2 { margin: 8px 0 0; color: #fff0a3; text-shadow: 3px 3px 0 #5f2941; }
.result-panel h1 { font-size: clamp(1.8rem, 8vw, 2.7rem); }
.result-screen__player { margin: 9px 0 0; color: #d6d3ee; font-weight: 700; }

.result-screen__score {
  display: grid;
  gap: 6px;
  margin: 25px auto 14px;
  padding: 18px;
  border: 3px solid #f3c75b;
  background: #312052;
}
.result-screen__score span { color: #e4c5ff; font-size: .75rem; font-weight: 900; letter-spacing: .1em; }
.result-screen__score strong { color: #fff0a3; font-size: clamp(2.1rem, 10vw, 3.6rem); line-height: 1; }

.result-screen__metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.result-screen__metrics p { margin: 0; border: 2px solid #896ba8; padding: 10px 5px; color: #d6d3ee; font-size: .74rem; }
.result-screen__metrics strong { display: block; margin-top: 4px; color: #fff8d9; font-size: .9rem; }
.result-screen__rank { display: grid; gap: 4px; margin-top: 16px; padding: 13px; border: 2px solid #f3c75b; background: #4b315f; }
.result-screen__rank span { color: #f7d678; font-weight: 900; }
.result-screen__rank strong { font-size: 1.05rem; }
.result-screen__perfect { margin: 18px 0 0; padding: 14px; color: #fff6bf; background: #43614c; font-weight: 900; }

.wrong-answers { margin-top: 23px; text-align: left; }
.wrong-answers h2 { margin: 0 0 9px; color: #fff0a3; font-size: 1.05rem; }
.wrong-answers ul { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
.wrong-answers li { display: grid; grid-template-columns: minmax(100px, 1fr) 1fr; gap: 4px 10px; border-left: 4px solid #e5a93e; padding: 10px 12px; background: #302050; }
.wrong-answers li > div { display: grid; align-content: start; }
.wrong-answers li strong { color: #fff8d9; font-family: Georgia, serif; font-size: 1.1rem; }
.wrong-answers li span { color: #d6d3ee; font-size: .74rem; }
.wrong-answers li p { margin: 0; color: #e8e0f5; font-size: .78rem; line-height: 1.45; }
.wrong-answers .is-timeout { color: #ffc0be; font-weight: 900; }
.wrong-answers .is-selected { color: #e4c5ff; }

.result-screen__online { margin-top: 20px; padding: 11px; border: 2px solid #896ba8; color: #d6d3ee; font-size: .8rem; }
.result-screen__online p { margin: 0; }
.result-screen__online.is-saved { border-color: #72c98b; color: #c9f7d4; }
.result-screen__online.is-error { border-color: #e98989; color: #ffc0be; }
.result-screen__online-retry { margin-top: 9px; border: 2px solid #fff0a3; padding: 7px 11px; color: #fff8d9; background: #5f2941; font-size: .8rem; font-weight: 900; }
.result-screen__actions { display: grid; gap: 10px; margin-top: 19px; }
.result-screen__primary, .result-screen__secondary { border: 3px solid #fff0a3; padding: 11px 16px; color: #2d1736; background: #f3bd55; font-weight: 900; }
.result-screen__secondary { border-color: #a98ac7; color: #fff8d9; background: #3a285e; }

.ranking-board { margin: 24px auto 0; padding: clamp(18px, 5vw, 30px); border: 3px solid #e5a93e; color: #fff5cf; background: #201644; box-shadow: 0 6px 0 #0d102b; }
.ranking-board header { text-align: center; }
.ranking-board h2 { font-size: 1.5rem; }
.ranking-board__tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 18px; }
.ranking-board__tabs button, .ranking-board__courses button { border: 2px solid #896ba8; color: #d6d3ee; background: #312052; font-weight: 900; }
.ranking-board__tabs button[aria-selected="true"], .ranking-board__courses button[aria-pressed="true"] { border-color: #fff0a3; color: #2d1736; background: #f3bd55; }
.ranking-board__courses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.ranking-board__courses button { min-height: 58px; padding: 7px 4px; font-size: .72rem; line-height: 1.25; }
.ranking-board__courses span { display: block; margin-top: 3px; color: inherit; font-size: .68rem; }
.ranking-board__panel { min-height: 80px; margin-top: 13px; }
.ranking-board__state { margin: 0; padding: 17px 10px; color: #d6d3ee; text-align: center; }
.ranking-board__state.is-error { border: 2px solid #e98989; color: #ffc0be; }
.ranking-board__state button { min-height: 38px; margin-top: 8px; border: 2px solid #fff0a3; padding: 6px 14px; color: #fff8d9; background: #5f2941; font-weight: 900; }
.ranking-board__list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.ranking-board__list li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto 25px; align-items: center; gap: 7px; padding: 9px; background: #302050; font-size: .78rem; }
.ranking-board__list strong { overflow: hidden; color: #fff8d9; text-overflow: ellipsis; white-space: nowrap; }
.ranking-board__place { color: #f7d678; font-weight: 900; }
.ranking-board__rank { display: grid; width: 24px; height: 24px; place-items: center; color: #2d1736; background: #f3bd55; font-weight: 900; }

@media (max-width: 470px) {
  .result-screen__metrics { grid-template-columns: 1fr; }
  .result-screen__metrics p { display: flex; justify-content: space-between; padding: 8px 10px; }
  .result-screen__metrics strong { margin: 0; }
  .wrong-answers li { grid-template-columns: 1fr; }
  .ranking-board__courses { grid-template-columns: 1fr; }
  .ranking-board__courses button { min-height: 46px; }
  .ranking-board__list li { grid-template-columns: 31px minmax(0, 1fr) auto 24px; }
  .ranking-board__list li > :nth-child(4) { display: none; }
}

/* Timed RPG battle */
.battle-screen,
.pause-screen {
  position: relative;
  display: grid;
  min-height: 100vh;
  min-height: 100dvh;
  place-items: center;
  overflow-x: hidden;
  overflow-y: auto;
  padding:
    max(18px, env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    max(22px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
  color: #fff5cf;
  background:
    radial-gradient(circle at 50% 5%, rgba(106, 72, 156, .78), transparent 42%),
    linear-gradient(160deg, #0c1437, #261747 62%, #0b102c);
}

.battle-screen::before {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle, rgba(255, 234, 145, .78) 0 2px, transparent 3px),
    radial-gradient(circle, rgba(255, 131, 54, .5) 0 2px, transparent 3px);
  background-position: 8% 12%, 88% 78%;
  background-size: 97px 83px, 131px 119px;
  content: "";
  opacity: .28;
  pointer-events: none;
}

.battle-shell {
  position: relative;
  z-index: 1;
  width: min(100%, 760px);
}

.battle-course-name {
  margin: 0 0 8px;
  color: #f7d678;
  font-size: .78rem;
  font-weight: 900;
  letter-spacing: .08em;
  text-align: center;
}

.battle-quiz {
  position: relative;
  border: 4px solid #f3c75b;
  box-shadow: 0 0 0 4px #51376f, 0 10px 0 rgba(8, 7, 27, .8);
  padding: clamp(16px, 4vw, 28px);
  background: rgba(18, 15, 50, .96);
}

.battle-quiz__header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: #d9cef0;
  font-size: .82rem;
  font-weight: 900;
}

.battle-quiz__header p { margin: 0; }
.battle-quiz__correct-count { color: #baf7cf; }

.battle-quiz__timer {
  height: 15px;
  margin-top: 10px;
  overflow: hidden;
  border: 2px solid #fff0a3;
  background: #3c244f;
}

.battle-quiz__timer-fill {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #e85e50, #f5b83d 42%, #70d57d);
  transition: width 50ms linear;
}

.battle-quiz__word-card {
  display: grid;
  justify-items: center;
  margin-top: 14px;
  border: 3px solid #896ba8;
  padding: clamp(16px, 5vw, 28px);
  background: linear-gradient(180deg, #35245d, #241b4b);
  text-align: center;
}

.battle-quiz__reading {
  margin: 0;
  color: #e4c5ff;
  font-size: clamp(.95rem, 4vw, 1.2rem);
  font-weight: 900;
  letter-spacing: .08em;
}

.battle-quiz__word-card h1 {
  margin: 3px 0 12px;
  color: #fff0a3;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(2.4rem, 12vw, 4.8rem);
  line-height: 1;
  text-shadow: 4px 4px 0 #5f2941;
}

.battle-quiz__replay {
  min-height: 44px;
  border: 2px solid #f3c75b;
  padding: 7px 15px;
  color: #fff8d9;
  background: #4b315f;
  font-size: .82rem;
  font-weight: 900;
}

.battle-quiz__countdown {
  position: absolute;
  z-index: 3;
  top: 34%;
  left: 50%;
  display: grid;
  width: 88px;
  height: 88px;
  margin: 0;
  place-items: center;
  border: 5px solid #fff0a3;
  color: #fff;
  background: rgba(142, 42, 52, .93);
  font-size: 3.4rem;
  font-weight: 1000;
  line-height: 1;
  text-shadow: 3px 3px 0 #5f2941;
  transform: translate(-50%, -50%);
  animation: battle-countdown .55s steps(2, end) infinite alternate;
}

.battle-quiz__choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}

.battle-quiz__choice {
  display: grid;
  grid-template-columns: 28px 1fr;
  align-items: center;
  min-height: 58px;
  border: 3px solid #a98ac7;
  padding: 8px 12px;
  color: #fff8d9;
  background: #3a285e;
  font-weight: 900;
  text-align: left;
}

.battle-quiz__choice > span {
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  color: #2d1736;
  background: #f3bd55;
}

.battle-quiz__choice.is-correct {
  border-color: #8df0a3;
  background: #315a45;
}

.battle-quiz__choice.is-wrong {
  border-color: #ff9a91;
  background: #6a2e48;
}

.battle-quiz__feedback {
  display: grid;
  gap: 3px;
  margin-top: 12px;
  border: 2px solid #8df0a3;
  padding: 10px;
  color: #c9f7d4;
  background: #284638;
  text-align: center;
}

.battle-quiz__feedback.is-wrong {
  border-color: #ff9a91;
  color: #ffd2cc;
  background: #5e2940;
}

.battle-quiz__feedback strong { font-size: 1.1rem; }
.battle-quiz__feedback span { font-size: .82rem; }

.pause-panel {
  position: relative;
  z-index: 1;
  width: min(100%, 500px);
  border: 4px solid #f3c75b;
  padding: clamp(24px, 7vw, 42px);
  color: #fff5cf;
  background: #18133c;
  text-align: center;
}

.pixel-kicker { color: #e4c5ff; font-size: .72rem; font-weight: 900; letter-spacing: .14em; }
.quest-primary-button, .quest-secondary-button {
  width: 100%;
  margin-top: 16px;
  border: 3px solid #fff0a3;
  padding: 10px 16px;
  color: #2d1736;
  background: #f3bd55;
  font-weight: 900;
}
.quest-secondary-button { color: #fff8d9; background: #3a285e; }

.quest-results-page {
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: max(36px, env(safe-area-inset-bottom));
  background: #090d28;
}

.quest-results-page .result-screen { min-height: auto; }
.quest-results-page .ranking-board { width: min(calc(100% - 32px), 680px); }

@keyframes battle-countdown {
  from { transform: translate(-50%, -50%) scale(.88); }
  to { transform: translate(-50%, -50%) scale(1.04); }
}

@media (max-width: 520px) {
  .battle-screen { place-items: start center; }
  .battle-quiz__choices { grid-template-columns: 1fr; gap: 7px; }
  .battle-quiz__word-card { padding-block: 13px; }
  .battle-quiz__word-card h1 { margin-bottom: 8px; }
  .battle-quiz__choice { min-height: 52px; }
}

.quiz-shell {
  width: min(100% - 28px, 760px);
  margin: 0 auto;
  padding: 20px 0 40px;
}

.app-header,
.progress-section > div:first-child {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.app-header {
  font-size: 1.1rem;
  font-weight: 900;
}

.brand-mark {
  display: grid;
  width: 40px;
  aspect-ratio: 1;
  place-items: center;
  border-radius: 12px;
  color: white;
  background: var(--teal);
  font-weight: 900;
}

.score-badge {
  margin-left: auto;
  padding: 7px 12px;
  border-radius: 999px;
  color: var(--teal-dark);
  background: #dff4f1;
  font-size: 0.95rem;
}

.progress-section {
  display: grid;
  gap: 9px;
  margin-top: 24px;
}

.progress-section > div:first-child span,
.eyebrow {
  margin: 0;
  color: var(--teal-dark);
  font-size: 0.76rem;
  font-weight: 900;
  letter-spacing: 0.1em;
}

.progress-track {
  height: 12px;
  overflow: hidden;
  border-radius: 999px;
  background: #dce8e5;
}

.progress-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--teal);
  transition: width 0.3s ease;
}

.question-card,
.result-card {
  margin-top: 24px;
  padding: clamp(24px, 7vw, 52px);
  border: 2px solid #e4ebe8;
  border-radius: 28px;
  background: var(--white);
  box-shadow: 0 16px 40px rgba(23, 35, 61, 0.08);
  text-align: center;
}

.question-card h1 {
  margin: 8px 0 18px;
  font-family: Georgia, serif;
  font-size: clamp(3rem, 14vw, 6.5rem);
  letter-spacing: -0.04em;
}

.speech-message {
  margin: 14px 0 0;
  color: var(--wrong);
  font-weight: 700;
}

.answers {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 20px;
}

.answer-button {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  border: 2px solid #d8e2df;
  border-radius: 16px;
  color: var(--ink);
  background: white;
  font-weight: 700;
  text-align: left;
  transition: border-color 0.2s ease, transform 0.2s ease;
}

.answer-button > span {
  display: grid;
  width: 28px;
  aspect-ratio: 1;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 50%;
  color: var(--teal-dark);
  background: #e8f5f3;
  font-size: 0.82rem;
}

.answer-button:not(:disabled):hover {
  border-color: var(--teal);
  transform: translateY(-1px);
}

.answer-button.is-correct {
  border-color: var(--correct);
  background: #e7f7f0;
}

.answer-button.is-wrong {
  border-color: var(--wrong);
  background: #fff0f2;
}

.feedback {
  display: grid;
  gap: 8px;
  margin-top: 18px;
  padding: 18px;
  border-radius: 18px;
}

.feedback.correct {
  background: #e7f7f0;
}

.feedback.wrong {
  background: #fff0f2;
}

.primary-button,
.speech-button {
  padding: 12px 22px;
  border: 0;
  border-radius: 999px;
  color: white;
  background: var(--teal-dark);
  font-weight: 800;
}

.feedback .primary-button,
.result-card .primary-button {
  justify-self: center;
  margin-top: 4px;
}

.result-card h1 {
  margin: 10px 0 18px;
}

.result-card > p {
  margin: 10px 0;
}

.result-score strong {
  display: block;
  font-size: 5rem;
  line-height: 1;
}

.result-score span {
  font-weight: 800;
}

@media (min-width: 640px) {
  .answers {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
